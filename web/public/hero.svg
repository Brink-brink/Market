<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF3E3"/>
      <stop offset="0.6" stop-color="#FBE3CF"/>
      <stop offset="1" stop-color="#F6CDB6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6E6"/>
      <stop offset="1" stop-color="#F9DDB4"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="720" fill="url(#sky)"/>
  <circle cx="1240" cy="210" r="120" fill="#FBD9A8" opacity="0.7"/>
  <circle cx="1240" cy="210" r="76" fill="#FCE7C3"/>

  <!-- distant rooftops -->
  <g fill="#F0BFA6" opacity="0.6">
    <rect x="0" y="400" width="150" height="200"/>
    <rect x="150" y="360" width="120" height="240"/>
    <rect x="270" y="420" width="170" height="180"/>
    <rect x="440" y="380" width="110" height="220"/>
    <rect x="550" y="430" width="190" height="170"/>
    <rect x="740" y="370" width="130" height="230"/>
    <rect x="870" y="410" width="160" height="190"/>
    <rect x="1030" y="350" width="120" height="250"/>
    <rect x="1150" y="420" width="180" height="180"/>
    <rect x="1330" y="380" width="130" height="220"/>
    <rect x="1460" y="410" width="140" height="190"/>
  </g>

  <!-- shopfronts -->
  <g>
    <!-- shop 1: teal -->
    <rect x="60" y="440" width="280" height="220" fill="#FFF8EE"/>
    <rect x="60" y="440" width="280" height="38" fill="#0F6E56"/>
    <path d="M50 478h300l-18 46H68z" fill="#1D9E75"/>
    <rect x="90" y="546" width="130" height="92" rx="4" fill="url(#glass)"/>
    <rect x="244" y="546" width="66" height="114" rx="4" fill="#0F6E56"/>
    <circle cx="298" cy="606" r="4" fill="#FCE7C3"/>

    <!-- shop 2: violet -->
    <rect x="360" y="410" width="300" height="250" fill="#FDF1E7"/>
    <rect x="360" y="410" width="300" height="40" fill="#534AB7"/>
    <path d="M350 450h320l-18 46H368z" fill="#7F77DD"/>
    <rect x="392" y="520" width="100" height="118" rx="4" fill="url(#glass)"/>
    <rect x="512" y="520" width="118" height="118" rx="4" fill="url(#glass)"/>
    <rect x="392" y="520" width="238" height="10" fill="#534AB7" opacity="0.25"/>

    <!-- shop 3: coral -->
    <rect x="680" y="450" width="260" height="210" fill="#FFF8EE"/>
    <rect x="680" y="450" width="260" height="36" fill="#993C1D"/>
    <path d="M670 486h280l-18 44H688z" fill="#D85A30"/>
    <rect x="708" y="552" width="70" height="108" rx="4" fill="#993C1D"/>
    <circle cx="766" cy="608" r="4" fill="#FCE7C3"/>
    <rect x="800" y="552" width="112" height="86" rx="4" fill="url(#glass)"/>

    <!-- shop 4: amber -->
    <rect x="960" y="420" width="290" height="240" fill="#FDF1E7"/>
    <rect x="960" y="420" width="290" height="40" fill="#854F0B"/>
    <path d="M950 460h310l-18 46H968z" fill="#EF9F27"/>
    <rect x="990" y="530" width="150" height="108" rx="4" fill="url(#glass)"/>
    <rect x="1162" y="530" width="62" height="130" rx="4" fill="#854F0B"/>
    <circle cx="1212" cy="598" r="4" fill="#FCE7C3"/>

    <!-- shop 5: blue -->
    <rect x="1270" y="445" width="280" height="215" fill="#FFF8EE"/>
    <rect x="1270" y="445" width="280" height="38" fill="#185FA5"/>
    <path d="M1260 483h300l-18 46H1278z" fill="#378ADD"/>
    <rect x="1300" y="552" width="64" height="108" rx="4" fill="#185FA5"/>
    <circle cx="1352" cy="608" r="4" fill="#FCE7C3"/>
    <rect x="1386" y="552" width="136" height="86" rx="4" fill="url(#glass)"/>
  </g>

  <!-- pavement and plants -->
  <rect x="0" y="660" width="1600" height="60" fill="#E9B79C"/>
  <rect x="0" y="660" width="1600" height="8" fill="#DDA286"/>
  <g fill="#0F6E56">
    <ellipse cx="350" cy="640" rx="18" ry="26"/>
    <ellipse cx="670" cy="640" rx="18" ry="26"/>
    <ellipse cx="950" cy="640" rx="18" ry="26"/>
    <ellipse cx="1260" cy="640" rx="18" ry="26"/>
  </g>
  <g fill="#993C1D">
    <rect x="338" y="650" width="24" height="16" rx="3"/>
    <rect x="658" y="650" width="24" height="16" rx="3"/>
    <rect x="938" y="650" width="24" height="16" rx="3"/>
    <rect x="1248" y="650" width="24" height="16" rx="3"/>
  </g>
</svg>
